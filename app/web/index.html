<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pramana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23233a6e'/%3E%3Cpath d='M16 6v18M9 10h14M9 10l-4 8h8zM23 10l-4 8h8zM11 25h10' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --side: #eef0f4; --ink: #1b1f27; --muted: #5d6573; --line: #dde1e8;
  --accent: #233a6e; --accent-ink: #ffffff; --accent-soft: #e3e9f6;
  --ok: #1a7f37; --ok-soft: #e6f4ea; --doubt: #9a6700; --doubt-soft: #fff4d6;
  --bad: #c62828; --bad-soft: #fdecec; --grey: #6b7280; --grey-soft: #f0f1f3;
  --user: #233a6e; --user-ink: #ffffff; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --side: #161a21; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2b313d;
    --accent: #8fa8e6; --accent-ink: #0f1420; --accent-soft: #232c42;
    --ok: #4cc26b; --ok-soft: #16301f; --doubt: #e0b443; --doubt-soft: #352b12;
    --bad: #f07171; --bad-soft: #3a1c1c; --grey: #9aa3b2; --grey-soft: #232833;
    --user: #2e4a8a; --user-ink: #f2f5fb; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --side: #161a21; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2b313d;
  --accent: #8fa8e6; --accent-ink: #0f1420; --accent-soft: #232c42;
  --ok: #4cc26b; --ok-soft: #16301f; --doubt: #e0b443; --doubt-soft: #352b12;
  --bad: #f07171; --bad-soft: #3a1c1c; --grey: #9aa3b2; --grey-soft: #232833;
  --user: #2e4a8a; --user-ink: #f2f5fb; --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100vh; }

/* ---------- sidebar ---------- */
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 6px; }
.brand svg { flex: none; }
.brand b { font-size: 18px; letter-spacing: .2px; }
.brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.newcase { margin: 12px 14px 4px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  cursor: pointer; text-align: left; font-weight: 600; }
.newcase:hover { border-color: var(--accent); }
.side-h { margin: 16px 18px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
.samples { overflow-y: auto; padding: 0 10px 10px; flex: 1; }
.sample { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 2px 0; border: 0; border-radius: 8px;
  background: transparent; cursor: pointer; }
.sample:hover { background: var(--accent-soft); }
.sample span { display: block; font-size: 13.5px; font-weight: 600; }
.sample em { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
.status { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--grey); vertical-align: 1px; }
.dot.up { background: var(--ok); } .dot.down { background: var(--bad); }

/* ---------- main ---------- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: none; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--side); }
.thread { flex: 1; overflow-y: auto; padding: 28px 16px 8px; }
.col { max-width: 860px; margin: 0 auto; }
.msg { display: flex; gap: 12px; margin: 0 0 22px; }
.avatar { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--user); color: var(--user-ink); border-radius: 14px 14px 4px 14px; padding: 10px 14px; max-width: 78%; white-space: pre-wrap; }
.msg.bot .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 13.5px; }
.welcome h1 { font-size: 24px; margin: 0 0 6px; }
.welcome p { margin: 6px 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); margin: 8px 0; }
.ask { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
input[type=date] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; }
.era { display: inline-block; font-weight: 700; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

/* progress */
.steps { list-style: none; margin: 8px 0 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 10px; padding: 3px 0; color: var(--muted); font-size: 14px; }
.steps li .ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 50%; font-size: 11px; border: 1.5px solid var(--line); }
.steps li.done { color: var(--ink); } .steps li.done .ic { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.active { color: var(--ink); font-weight: 600; }
.steps li.active .ic { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.steps li.skipped { opacity: .5; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.active .ic { animation: none; border-top-color: var(--accent); } }

/* report */
.report h3 { font-size: 15.5px; margin: 20px 0 8px; display: flex; align-items: center; gap: 8px; }
.report h3 .n { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.head .code { font-size: 17px; font-weight: 700; }
.card { border: 1px solid var(--line); border-left: 5px solid var(--grey); border-radius: 8px; padding: 9px 12px; margin: 7px 0; background: var(--panel); }
.card.ok { border-left-color: var(--ok); } .card.doubt { border-left-color: var(--doubt); } .card.bad { border-left-color: var(--bad); }
.card .t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .3px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.doubt { background: var(--doubt-soft); color: var(--doubt); }
.tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.grey { background: var(--grey-soft); color: var(--grey); }
.sec { font-weight: 700; } .strike { text-decoration: line-through; }
.card .d { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.banner { border-radius: 8px; padding: 9px 12px; margin: 8px 0; font-size: 14px; }
.banner.warn { background: var(--doubt-soft); } .banner.info { background: var(--accent-soft); } .banner.err { background: var(--bad-soft); color: var(--bad); }
blockquote { margin: 6px 0; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--muted); }
details.prec { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--panel); }
details.prec summary { cursor: pointer; padding: 8px 12px; font-size: 14px; }
details.prec summary b { font-weight: 700; }
details.prec .x { padding: 0 12px 10px; font-size: 13.5px; }
details.prec .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
.legend summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 8px; }
.legend ul { margin: 6px 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 6px; margin: 10px 0; }
.tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.tabs button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

/* composer */
.composer { padding: 10px 16px 16px; }
.box { max-width: 860px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px 8px; }
.box:focus-within { border-color: var(--accent); }
.box textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; min-height: 52px; max-height: 240px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.hint { max-width: 860px; margin: 6px auto 0; text-align: center; color: var(--muted); font-size: 12px; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; inset: 0 25% 0 0; z-index: 10; transform: translateX(-105%); transition: transform .2s; }
  aside.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .topbar { display: flex; }
  .msg.user .bubble { max-width: 92%; }
  .avatar { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 6v18M9 10h14M9 10l-4 8h8zM23 10l-4 8h8zM11 25h10" stroke="var(--accent-ink)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Pramana</b><small>Indian criminal law research · runs on this laptop</small></div>
    </div>
    <button class="newcase" id="newcase">+ New case</button>
    <div class="side-h">Sample cases</div>
    <div class="samples" id="samples"><div class="note" style="padding:6px 10px">Loading…</div></div>
    <div class="status" id="status"><span class="dot"></span>Checking backend…</div>
  </aside>

  <main>
    <div class="topbar"><button class="chip" id="menu">☰ Samples</button><b>Pramana</b><span></span></div>
    <div class="thread" id="thread"><div class="col" id="col"></div></div>
    <div class="composer">
      <form class="box" id="form">
        <textarea id="input" rows="2" placeholder="Describe the case: what happened, who did what, and when (e.g. “On 15 August 2024 the accused…”)"></textarea>
        <div class="row">
          <label>Offence date <input type="date" id="date"> <span id="datehint">or write it in the text</span></label>
          <button class="btn" id="send" type="submit">Analyse</button>
        </div>
      </form>
      <div class="hint">Research aid, not legal advice. Every section shown is checked against the ingested IPC/BNS; nothing leaves this machine.</div>
    </div>
  </main>
</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const col = $("#col"), thread = $("#thread"), input = $("#input"), dateIn = $("#date"), sendBtn = $("#send");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmt = iso => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const ERA = {ipc: "IPC", bns: "BNS"};
const STAGE_ORDER = ["intake", "route", "retrieve", "statute_identifier", "verifier", "applicability", "precedents", "analytics", "defense"];
const STAGE_LABEL = {
  intake: "Checking whether this is a court order or FIR", route: "Choosing the code from the offence date",
  retrieve: "Searching statutes and judgments", statute_identifier: "Proposing sections (local model)",
  verifier: "Verifying every citation against the citation graph", applicability: "Checking each section against the facts",
  precedents: "Matching precedent judgments", analytics: "Aggregating outcomes", defense: "Drafting counter-arguments"};
let busy = false, pending = null, health = null;
dateIn.max = new Date().toISOString().slice(0, 10);

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || r.statusText));
  return data;
}
function scrollDown() { thread.scrollTop = thread.scrollHeight; }
function addUser(text) {
  const m = document.createElement("div"); m.className = "msg user";
  m.innerHTML = `<div class="bubble">${esc(text)}</div>`; col.append(m); scrollDown(); return m;
}
function addBot(html) {
  const m = document.createElement("div"); m.className = "msg bot";
  m.innerHTML = `<div class="avatar" aria-hidden="true">P</div><div class="body">${html}</div>`;
  col.append(m); scrollDown(); return $(".body", m);
}
function setBusy(b) { busy = b; sendBtn.disabled = b; sendBtn.textContent = b ? "Working…" : "Analyse"; }

/* ---------------- welcome ---------------- */
function welcome() {
  col.innerHTML = "";
  pending = null;
  const b = addBot(`<div class="welcome"><h1>Tell me about the case.</h1>
    <p>Describe what happened in plain words, and when. I'll pick the code from the offence date (IPC before 1 July 2024, BNS on or after),
    propose the applicable sections, <b>verify every citation</b> against the ingested statutes, check each one against your facts,
    match precedent judgments and draft counter-arguments for the defence.</p>
    <p>You can also paste an FIR or a court order; I'll pull out the alleged facts first. A live analysis takes about 1.5–3 minutes.</p>
    <div class="chips" id="chips"></div></div>`);
  loadSamples(b);
}

/* ---------------- samples ---------------- */
let SAMPLE_LIST = [];
async function loadSamples(welcomeBody) {
  try { if (!SAMPLE_LIST.length) SAMPLE_LIST = await api("/samples"); }
  catch (e) { $("#samples").innerHTML = `<div class="note" style="padding:6px 10px">Backend not reachable.</div>`; return; }
  $("#samples").innerHTML = SAMPLE_LIST.map(s => `<button class="sample" data-id="${esc(s.id)}"><span>${esc(s.name)}</span>
    <em>offence ${esc(fmt(s.offence_date))}${s.saved ? " · saved result" : ""}</em></button>`).join("");
  const chips = welcomeBody && $("#chips", welcomeBody);
  if (chips) chips.innerHTML = SAMPLE_LIST.slice(0, 4).map(s => `<button class="chip" data-id="${esc(s.id)}">${esc(s.name.replace(/ \(.*\)$/, ""))}</button>`).join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b && !busy) { $("#side").classList.remove("open"); openSample(b.dataset.id); }
});
async function openSample(id) {
  const s = SAMPLE_LIST.find(x => x.id === id); if (!s) return;
  pending = null;
  addUser(s.facts);
  const body = addBot(`<div class="note">Offence date <b>${fmt(s.offence_date)}</b> (sample case).</div>`);
  if (!s.saved) { startJob(s.facts, s.offence_date, body); return; }
  try {
    const rep = await api(`/samples/${encodeURIComponent(id)}`);
    body.insertAdjacentHTML("beforeend", `<div class="banner info">Saved result from an earlier run of this exact case — opens instantly.
      <button class="btn ghost" style="margin-left:8px;padding:3px 10px" data-live>Run it live now</button></div>`);
    $("[data-live]", body).onclick = ev => { ev.target.disabled = true; if (!busy) startJob(s.facts, s.offence_date, addBot("")); };
    renderReport(rep, body);
  } catch (e) { body.insertAdjacentHTML("beforeend", `<div class="banner err">${esc(e.message)}</div>`); }
  scrollDown();
}

/* ---------------- sending a case ---------------- */
$("#form").addEventListener("submit", e => { e.preventDefault(); send(); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 240) + "px"; });

async function send() {
  const text = input.value.trim();
  if (busy || !text) return;
  const picked = dateIn.value;
  input.value = ""; input.style.height = "auto";
  addUser(text);
  // Answering the date question with a short message ("it was 3 March 2025")
  if (pending && text.length < 120) {
    const found = await readDates(text);
    const ok = found ? found.dates.filter(d => !d.error) : [];
    if (ok.length === 1) { const p = pending; pending = null; return go(p.facts, ok[0].date, addBot("")); }
    if (text.length < 40) {
      const why = found && found.dates.some(d => d.error) ? "That date is in the future." :
        "I couldn't read an exact date in that (I need the day, month and year, e.g. 3 March 2025).";
      addBot(`<div class="note">${why} Please reply with the offence date, or pick it above.</div>`);
      return;
    }
  }
  if (text.length < 20) { addBot(`<div class="note">Please describe the case in a little more detail — what happened, who did it, and when.</div>`); return; }
  pending = null;
  const body = addBot("");
  if (picked) return go(text, picked, body);
  const found = await readDates(text);
  if (!found) { body.innerHTML = `<div class="banner err">The backend is not reachable. Start it with <b>run_web.bat</b>.</div>`; return; }
  const valid = found.dates.filter(d => !d.error);
  if (valid.length === 1) return go(text, valid[0].date, body);
  askDate(text, body, valid, found.month_only);
}
async function readDates(text) { try { return await api("/dates", {text}); } catch { return null; } }

function askDate(facts, body, options, monthOnly) {
  pending = {facts, body};
  let q;
  if (options.length > 1) q = `Your description mentions ${options.length} dates. Which one is the date of the <b>offence</b>? (Not the FIR or arrest date — the offence date decides IPC or BNS.)`;
  else if (monthOnly.length) q = `You mention <b>${esc(monthOnly[0])}</b>, but I need the exact day: the IPC applies to offences before 1 July 2024 and the BNS from that day, so I never guess it.`;
  else q = `When did the offence happen? The date decides the code — IPC before 1 July 2024, BNS on or after — so I need it rather than guess.`;
  body.innerHTML = `<div>${q}</div><div class="ask">
    ${options.map(o => `<button class="btn ghost" data-date="${o.date}">${fmt(o.date)} <span class="era">${ERA[o.era]}</span></button>`).join("")}
    <input type="date" max="${dateIn.max}" aria-label="Offence date"><button class="btn" data-pick>Use this date</button></div>
    <div class="note" style="margin-top:6px">…or just reply with the date.</div>`;
  body.querySelectorAll("[data-date]").forEach(b => b.onclick = () => { if (!busy && pending) { pending = null; go(facts, b.dataset.date, addBot("")); } });
  $("[data-pick]", body).onclick = () => { const v = $("input", body).value; if (v && !busy && pending) { pending = null; go(facts, v, addBot("")); } };
  scrollDown();
}

function go(facts, date, body) {
  dateIn.value = "";
  startJob(facts, date, body);
}

async function startJob(facts, date, body) {
  setBusy(true);
  body.innerHTML = `<div class="note">Offence date <b>${fmt(date)}</b> → <span class="era" id="era-tag">…</span></div>
    <div class="panel"><b>Analysing on this laptop</b> <span class="note" data-el>· 0 s</span><ul class="steps" data-steps></ul></div>`;
  const tag = $("#era-tag", body); tag.removeAttribute("id");
  // The server's router decides the code; the page never compares dates itself.
  readDates(date).then(f => { const d = f && f.dates[0]; tag.textContent = d && d.era ? `${ERA[d.era]} applies` : "code: see report"; });
  const stepsEl = $("[data-steps]", body), elEl = $("[data-el]", body);
  const draw = (stages, finished) => {
    const seen = stages.map(s => s.stage), last = seen[seen.length - 1];
    stepsEl.innerHTML = STAGE_ORDER.map(st => {
      const n = seen.filter(x => x === st).length;
      let cls = n ? (st === last && !finished ? "active" : "done") : (finished ? "skipped" : "");
      const extra = n > 1 && (st === "statute_identifier") ? ` <span class="note">(retry ${n - 1})</span>` : "";
      return `<li class="${cls}"><span class="ic">${cls === "done" ? "✓" : ""}</span>${esc(STAGE_LABEL[st])}${extra}</li>`;
    }).join("");
  };
  draw([], false);
  let job;
  try { job = await api("/jobs", {facts, offence_date: date}); }
  catch (e) { body.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; setBusy(false); return; }
  const poll = async () => {
    let s;
    try { s = await api(`/jobs/${job.id}`); }
    catch (e) { body.insertAdjacentHTML("beforeend", `<div class="banner err">${esc(e.message)}</div>`); setBusy(false); return; }
    elEl.textContent = `· ${Math.round(s.elapsed)} s` + (s.state === "queued" ? " · waiting for the previous analysis" : "");
    draw(s.stages, s.state === "done" || s.state === "error");
    if (s.state === "done") {
      const p = $(".panel", body); p.querySelector("b").textContent = `Done in ${Math.round(s.elapsed)} s`;
      p.querySelector("[data-el]").textContent = ""; stepsEl.remove();
      renderReport(s.report, body); setBusy(false); scrollDown();
    } else if (s.state === "error") {
      body.insertAdjacentHTML("beforeend", `<div class="banner err">${esc(s.error)}</div>`); setBusy(false);
    } else setTimeout(poll, 1000);
  };
  poll();
}

/* ---------------- report ---------------- */
function card(kind, tag, title, desc) {
  return `<div class="card ${kind}"><div class="t"><span class="tag ${kind}">${esc(tag)}</span><span class="sec">${title}</span></div>${desc ? `<div class="d">${desc}</div>` : ""}</div>`;
}
const ref = c => esc(`${c.code} ${c.subsection || c.section}`);
const title = c => esc(String(c.title || "").replace(/[\s:.–—-]+$/, ""));  // "...common intention -" in the source data

function renderReport(r, body) {
  const box = document.createElement("div"); box.className = "report"; body.append(box);
  if (r.status === "straddles_transition") {
    box.innerHTML = (r.warnings || []).map(w => `<div class="banner warn">${esc(w)}</div>`).join("") + `<div class="tabs"></div><div data-run></div>`;
    const tabs = $(".tabs", box), runEl = $("[data-run]", box), eras = Object.keys(r.runs);
    const show = era => { tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.era === era)); runEl.innerHTML = ""; renderRun(r.runs[era], runEl); };
    tabs.innerHTML = eras.map(e => `<button data-era="${e}">${ERA[e]} run</button>`).join("");
    tabs.querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.era));
    show(eras[0]); return;
  }
  renderRun(r, box);
}

function renderRun(r, box) {
  let h = `<div class="head"><span class="code">${ERA[r.era]}</span><span class="note">${esc(r.code_applied)} · chosen by the date rule, not by the model</span></div>`;
  const it = r.intake || {};
  if (it.extracted) h += `<div class="banner info"><b>Court order / FIR detected.</b> Analysed the alleged facts extracted from it — check them against the original:<blockquote>${esc(it.facts)}</blockquote></div>`;
  (r.warnings || []).forEach(w => h += `<div class="banner warn">${esc(w)}</div>`);
  if (r.status === "insufficient_data") h += `<div class="banner info">Nothing in the corpus is close enough to these facts to ground an analysis, so the model was not asked. The nearest statute sections are listed for review.</div>`;

  const sup = r.charges.filter(c => !c.doubt), dbt = r.charges.filter(c => c.doubt);
  h += `<h3><span class="n">1</span>Applicable sections</h3>`;
  if (!r.charges.length) h += `<div class="note">No section was both proposed and verified for these facts.</div>`;
  sup.forEach(c => h += card("ok", "VERIFIED · SUPPORTED", `${ref(c)} — ${title(c)}`, esc(c.reason)));
  dbt.forEach(c => h += card("doubt", "VERIFIED · APPLICABILITY DOUBTED", `${ref(c)} — ${title(c)}`, `<b>Doubt:</b> ${esc(c.doubt)}`));
  (r.included || []).forEach(c => h += card("grey", `INCLUDED IN ${c.included_in}`, `${ref(c)} — ${title(c)}`,
    `${esc(c.included_in)} is an aggravated form of this offence and is supported, so it covers this one.`));
  (r.withdrawn || []).forEach(w => h += card("grey", "CONSIDERED · RULED OUT BY THE MODEL", esc(`${w.code} ${w.raw}`), `${esc(w.reason)} (not verified, not charged)`));
  (r.unconfirmed || []).forEach(u => h += card("bad", "UNCONFIRMED · REJECTED BY CITATION GRAPH", `<span class="strike">${esc(`${u.code} ${u.raw || u.section}`)}</span>`,
    esc(u.why) + (u.round != null ? ` (round ${u.round})` : "")));
  if ((r.review_candidates || []).length) {
    h += `<div class="note" style="margin-top:8px"><b>Nearest statute sections, for review</b> (retrieval results, not verified charges):</div>`;
    r.review_candidates.forEach(c => h += card("grey", "NOT VERIFIED · FOR REVIEW", esc(`${ERA[r.era]} ${c.matched || c.section} — ${c.title || ""}`)));
  }
  h += `<details class="legend"><summary>How to read this</summary><ul>
    <li><b>Verified</b>: the section exists in the ingested code, checked against the citation graph. The model's proposals are never shown as real without it.</li>
    <li><b>Supported / doubted</b>: a second check — the model must quote the facts for every ingredient on two readings. Rules also apply (rioting needs five people, murder needs a death).</li>
    <li><b>Included in</b>: a lesser offence covered by a supported aggravated charge, so it is not counted twice.</li>
    <li><b>Unconfirmed</b>: proposed by the model and rejected by the graph — shown so nothing is hidden.</li></ul></details>`;

  h += `<h3><span class="n">2</span>Precedents</h3>`;
  if (!(r.precedents || []).length) h += `<div class="note">No precedent: no verified section to match.</div>`;
  (r.precedents || []).forEach(p => {
    const via = p.via_ipc_predecessor ? ` · via IPC predecessor (${esc(p.via_ipc_predecessor)})` : "";
    const sim = p.similarity ? ` · similarity ${p.similarity.toFixed(2)}` : " · most cited";
    h += `<details class="prec"><summary><b>[${esc(p.label)}]</b> ${esc(p.title || p.doc_id)} <span class="note">— ${esc(p.court || "")} · for ${esc(p.for_charge)}${via}</span></summary>
      <div class="x"><div class="meta"><span class="tag ok">VERIFIED JUDGMENT</span> applies ${esc(p.applies)}${sim} · ${esc(p.date || "")} ${esc(p.citation || "")} · disposal: ${esc(p.disposal_nature || "n/a")} · id ${esc(p.doc_id)}</div>${esc(p.excerpt || "")}</div></details>`;
  });

  h += `<h3><span class="n">3</span>Counter-arguments for the defence</h3>`;
  if (!(r.defenses || []).length) h += `<div class="note">None generated (no verified section).</div>`;
  (r.defenses || []).forEach(d => {
    let desc = esc(d.argument);
    if (d.fact_quote) desc += `<br><b>Turns on:</b> “${esc(d.fact_quote)}”`;
    if ((d.precedents || []).length) desc += `<br><b>Relies on:</b> ${d.precedents.map(x => `${esc(x.label)} (${esc(x.title || x.doc_id)})`).join(", ")}`;
    if ((d.issues || []).length) desc += `<br><b>Issues:</b> ${esc(d.issues.join("; "))}`;
    h += card(d.verified ? "ok" : "bad", d.verified ? "GROUNDED · CHECKED" : "FAILED FINAL CHECK", `Against ${esc(d.against)}`, desc);
  });

  h += `<h3><span class="n">4</span>Outcome analytics</h3>`;
  const a = r.analytics || {};
  if (a.error) h += `<div class="banner err">${esc(a.error)}</div>`;
  else if ((a.sections || []).length) {
    h += `<div class="note">${esc(a.note)} Figures under ${esc(a.min_judgments)} judgments are suppressed.</div><div class="tablewrap"><table>
      <tr><th>Section</th><th>Judgments</th><th>Appellant/petitioner succeeded</th><th>Allowed</th><th>Partly</th><th>Dismissed</th><th>Other</th></tr>`;
    a.sections.forEach(s => [[s.charge, s.direct], ...s.via_ipc.map(v => [`${s.charge} ← IPC ${v.section}`, v])].forEach(([label, x]) => {
      const c = x.counts, share = x.suppressed ? "suppressed (<5)" : (x.allowed_share != null ? Math.round(x.allowed_share * 100) + "%" : "n/a");
      h += `<tr><td>${esc(label)}</td><td class="num">${x.judgments}</td><td>${share}</td><td class="num">${c.allowed}</td><td class="num">${c["partly allowed"]}</td><td class="num">${c.dismissed}</td><td class="num">${c.other}</td></tr>`;
    }));
    h += `</table></div>`;
  } else h += `<div class="note">No verified section to aggregate.</div>`;

  const t = r.timings || {};
  h += `<div class="foot">Run time: ${Object.entries(t).map(([k, v]) => `${k.replace(/_s$/, "")} ${v}s`).join(", ")} · generated locally (Ollama); nothing left this machine.</div>`;
  box.insertAdjacentHTML("beforeend", h);
}

/* ---------------- health ---------------- */
async function checkHealth() {
  const el = $("#status");
  try {
    health = await api("/health");
    el.innerHTML = `<span class="dot ${health.ollama ? "up" : "down"}"></span>Backend up · ${esc(health.model)} · Ollama ${health.ollama ? "up" : "DOWN"}`;
  } catch { el.innerHTML = `<span class="dot down"></span>Backend not reachable`; }
}

$("#newcase").onclick = () => { if (!busy) { welcome(); input.focus(); } };
$("#menu").onclick = () => $("#side").classList.toggle("open");
welcome(); checkHealth(); setInterval(checkHealth, 30000);
// Deep link for demos: /#sample=group_assault opens that saved case directly.
const deep = location.hash.match(/^#sample=([\w-]+)$/);
if (deep) loadSamples().then(() => openSample(deep[1]));
input.focus();
</script>
